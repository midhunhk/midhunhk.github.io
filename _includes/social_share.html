{% assign share_url = site.url | append: site.baseurl | append: page.url %}
<h4>Share this article</h4>

<div class="mh-share{% if include.centered %} is-justify-content-center{% endif %}">
    <a href="https://www.facebook.com/share.php?u={{ share_url | url_encode }}" target="_blank" rel="noopener" title="Share on Facebook" aria-label="Share on Facebook">
        <i class="fab fa-facebook-f"></i>
    </a>
    <a href="https://twitter.com/intent/tweet?url={{ share_url | url_encode }}&text={{ page.title | url_encode }}" target="_blank" rel="noopener" title="Share on X / Twitter" aria-label="Share on X / Twitter">
        <i class="fab fa-twitter"></i>
    </a>
    <a href="https://www.linkedin.com/shareArticle?mini=true&url={{ share_url | url_encode }}&title={{ page.title | url_encode }}&summary=&utm_medium=social_share&utm_source=linkedin" target="_blank" rel="noopener" title="Share on LinkedIn" aria-label="Share on LinkedIn">
        <i class="fab fa-linkedin-in"></i>
    </a>
    <a href="https://reddit.com/submit?url={{ share_url | url_encode }}&title={{ page.title | url_encode }}" target="_blank" rel="noopener" title="Share on Reddit" aria-label="Share on Reddit">
        <i class="fab fa-reddit-alien"></i>
    </a>
</div>
