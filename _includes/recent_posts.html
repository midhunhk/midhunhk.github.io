<h4>Recent posts</h4>
{% assign posts = site.posts | where_exp:"post","post.url != page.url" %}
<ul class="mh-recent">
  {% for post in posts limit:4 %}
    <li>
      <a href="{{ post.url | relative_url }}">
        {{ post.title }}
        <small>{{ post.date | date: "%b %-d, %Y" }}</small>
      </a>
    </li>
  {% endfor %}
</ul>
